[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "articles-to-anki"
version = "0.1.0"
description = "Extract hand-highlighted vocabulary from PDFs and create Anki cards."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "argostranslate>=1.11,<2",
  "argon2-cffi>=25.1,<26",
  "cryptography>=45,<47",
  "Flask>=3.1,<4",
  "nltk>=3.9,<4",
  "numpy>=1.26,<3",
  "pdfplumber>=0.11,<1",
  "Pillow>=10,<13",
  "pydantic>=2.13.4,<3",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<5",
  "RapidFuzz>=3.14,<4",
  "waitress>=3,<4",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
articles-to-anki = "articles_to_anki.cli:main"
anki-papers-admin = "articles_to_anki.admin:main"
anki-papers-web = "articles_to_anki.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
articles_to_anki = [
  "templates/*.html",
  "static/*.css",
  "static/*.js",
  "static/vendor/pdfjs/*.mjs",
  "static/vendor/pdfjs/LICENSE",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: tests using official disposable Anki sync server",
]
