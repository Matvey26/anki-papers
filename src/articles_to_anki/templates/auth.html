{% extends "base.html" %}
{% block title %}Вход — Anki Papers{% endblock %}
{% block page_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Anki Papers</h1>
  <p>Введите логин. Если он новый — профиль создастся автоматически.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Логин<input name="username" autocomplete="username" minlength="3" maxlength="32" required autofocus></label>
    <button class="primary full">Продолжить</button>
  </form>
</section>
{% endblock %}
