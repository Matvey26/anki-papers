name: Fetch production rebuild logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Fetch logs
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          encoded_password="$(printf '%s' "$SERVER_PASSWORD" | base64 -w 0)"
          sshpass -e ssh "$SERVER_USER@$SERVER_IP" \
            "DIAG_PASSWORD_B64=$encoded_password bash -se" <<'REMOTE'
          run_root() {
            if test "$(id -u)" -eq 0; then
              "$@"
            else
              printf '%s' "$DIAG_PASSWORD_B64" | base64 -d | sudo -S -p '' "$@"
            fi
          }
          echo "=== units ==="
          run_root systemctl list-units --all --no-pager | grep -i anki || true
          echo "=== service files ==="
          ls "$HOME/anki-papers/deploy/" 2>/dev/null || true
          cat "$HOME/anki-papers/deploy/anki-papers-web.service" 2>/dev/null || true
          echo "=== journal web ==="
          run_root journalctl -u anki-papers-web -n 300 --no-pager 2>&1 | tail -250 || true
          echo "=== app dir ==="
          ls -la "$HOME/anki-papers/" | head -30
          ls -la "$HOME/anki-papers/data/" 2>/dev/null | head -20
          find "$HOME/anki-papers" -maxdepth 2 -name "*.log" -o -maxdepth 2 -name "nohup.out" 2>/dev/null | head
          echo "=== tail app.log ==="
          tail -200 "$HOME/anki-papers/app.log" 2>/dev/null || true
          unset DIAG_PASSWORD_B64
          REMOTE