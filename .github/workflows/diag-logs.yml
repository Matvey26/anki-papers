name: Fetch production rebuild logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Fetch logs
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          encoded_password="$(printf '%s' "$SERVER_PASSWORD" | base64 -w 0)"
          sshpass -e ssh "$SERVER_USER@$SERVER_IP" \
            "DIAG_PASSWORD_B64=$encoded_password bash -se" <<'REMOTE'
          run_root() {
            if test "$(id -u)" -eq 0; then
              "$@"
            else
              printf '%s' "$DIAG_PASSWORD_B64" | base64 -d | sudo -S -p '' "$@"
            fi
          }
          cd "$HOME/anki-papers"
          .venv/bin/python - <<'PY'
          import json
          import sqlite3
          database = sqlite3.connect("data/app.sqlite3")
          database.row_factory = sqlite3.Row
          columns = [row[1] for row in database.execute("PRAGMA table_info(cards)")]
          print("cards columns:", columns)
          print("highlights count by status:", dict(
              database.execute("SELECT status, COUNT(*) FROM highlights GROUP BY status").fetchall()
          ))
          print("highlights by user:", dict(
              database.execute("SELECT user_id, COUNT(*) FROM highlights GROUP BY user_id").fetchall()
          ))
          print("cards by user:", dict(
              database.execute("SELECT user_id, COUNT(*) FROM cards GROUP BY user_id").fetchall()
          ))
          from collections import Counter
          sources = Counter()
          sample_ids = []
          for row in database.execute("SELECT contexts_json FROM cards WHERE semantic_version = 1"):
              contexts = json.loads(row[0] or "[]")
              for item in contexts:
                  if isinstance(item, dict):
                      sources[item.get("source")] += 1
                      if len(sample_ids) < 6:
                          sample_ids.append((item.get("id"), item.get("source")))
          print("context sources:", dict(sources))
          print("sample ctx ids:", sample_ids)
          hl_ids = {str(r[0]) for r in database.execute("SELECT id FROM highlights")}
          overlap = [cid for cid, _src in sample_ids if cid in hl_ids]
          print("ctx ids in highlights table:", overlap)
          database.close()
          PY
          echo "=== mirror files ==="
          ls -la "$HOME/anki-papers/data/anki_mirrors/" 2>/dev/null || true
          echo "=== anki_accounts ==="
          .venv/bin/python - <<'PY'
          import sqlite3
          database = sqlite3.connect("data/app.sqlite3")
          database.row_factory = sqlite3.Row
          for row in database.execute("SELECT user_id, state, mirror_path, mirror_key_version FROM anki_accounts"):
              print("account:", dict(row))
          database.close()
          PY
          echo "=== journal: rebuild window ==="
          run_root journalctl -u anki-papers-web --since "2026-08-18 19:15" --no-pager | grep -E "ERROR|Traceback|Rebuild|collation|Deck rebuild|RuntimeError|Decrypt|mirror" | tail -120
          unset DIAG_PASSWORD_B64
          REMOTE