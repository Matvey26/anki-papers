name: Fetch production rebuild logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Fetch logs
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          encoded_password="$(printf '%s' "$SERVER_PASSWORD" | base64 -w 0)"
          sshpass -e ssh "$SERVER_USER@$SERVER_IP" \
            "DIAG_PASSWORD_B64=$encoded_password bash -se" <<'REMOTE'
          run_root() {
            if test "$(id -u)" -eq 0; then
              "$@"
            else
              printf '%s' "$DIAG_PASSWORD_B64" | base64 -d | sudo -S -p '' "$@"
            fi
          }
          echo "=== rebuild failed traceback ==="
          run_root journalctl -u anki-papers-web --since "2026-08-18 14:05" --no-pager 2>/dev/null | grep -A 25 "Deck rebuild failed" | head -35 || true
          echo "=== database state ==="
          cd "$HOME/anki-papers"
          .venv/bin/python - <<'PY'
          import json
          import sqlite3
          database = sqlite3.connect("data/app.sqlite3")
          database.row_factory = sqlite3.Row
          print("users:", [dict(r) for r in database.execute("SELECT id, username FROM users")])
          print("highlights total/ready:", database.execute("SELECT COUNT(*), SUM(status = 'ready') FROM highlights").fetchone())
          print("cards semantic_version=1:", database.execute("SELECT COUNT(*) FROM cards WHERE semantic_version = 1").fetchone()[0])
          for row in database.execute("SELECT id, target, status FROM highlights LIMIT 8"):
              print("hl:", dict(row))
          for row in database.execute("SELECT id FROM cards WHERE semantic_version = 1 LIMIT 8"):
              contexts = json.loads(row["contexts_json"] or "[]")
              print("card:", row["id"], "ctx ids:", [c.get("id") for c in contexts if isinstance(c, dict)][:4],
                    "sources:", [c.get("source") for c in contexts if isinstance(c, dict)][:4])
          database.close()
          PY
          unset DIAG_PASSWORD_B64
          REMOTE