name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]' -e ./sync-worker
      - run: node --experimental-vm-modules --test tests/test_reader_modules.mjs
      - run: pytest -q
      - run: RUN_ANKI_SYNC_INTEGRATION=1 pytest -q tests/test_anki_integration.py tests/test_rebuild*.py tests/test_official_adapter.py
      - run: python -m pip check

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: deepseek/deepseek-v4-flash-0731:nitro
      OPENROUTER_SEMANTIC_MODEL: deepseek/deepseek-v4-flash-0731:nitro
      APP_SECRET: ${{ secrets.APP_SECRET }}
      ANKI_CREDENTIAL_KEY: ${{ secrets.ANKI_CREDENTIAL_KEY }}
      ANKIWEB_ALLOWED_USERS: risesduckness
    steps:
      - uses: actions/checkout@v5
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Copy application
        run: |
          set -euo pipefail
          test -n "$SERVER_IP"
          test -n "$SERVER_USER"
          test -n "$SERVER_PASSWORD"
          test -n "$ANKI_CREDENTIAL_KEY"
          export SSHPASS="$SERVER_PASSWORD"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts"
          sshpass -e ssh "$SERVER_USER@$SERVER_IP" 'mkdir -p "$HOME/anki-papers"'
          git archive --format=tar.gz HEAD | \
            sshpass -e ssh "$SERVER_USER@$SERVER_IP" 'tar -xzf - -C "$HOME/anki-papers"'
      - name: Copy runtime configuration
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          {
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            printf 'OPENROUTER_MODEL=%s\n' "$OPENROUTER_MODEL"
            printf 'OPENROUTER_SEMANTIC_MODEL=%s\n' "$OPENROUTER_SEMANTIC_MODEL"
            printf 'APP_SECRET=%s\n' "$APP_SECRET"
            printf 'ANKI_CREDENTIAL_KEY=%s\n' "$ANKI_CREDENTIAL_KEY"
            printf 'ANKIWEB_ALLOWED_USERS=%s\n' "$ANKIWEB_ALLOWED_USERS"
            printf 'ANKI_PAPERS_BACKUP_BACKEND=yandex_disk\n'
          } | sshpass -e ssh "$SERVER_USER@$SERVER_IP" \
            'umask 077; cat > "$HOME/anki-papers/.env"'
      - name: Back up, install, and restart services
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          encoded_password="$(printf '%s' "$SERVER_PASSWORD" | base64 -w 0)"
          sshpass -e ssh "$SERVER_USER@$SERVER_IP" \
            "DEPLOY_PASSWORD_B64=$encoded_password bash -se" <<'REMOTE'
          cd "$HOME/anki-papers"
          bash deploy/install.sh
          REMOTE
      - name: Verify production HTTPS and worker heartbeat
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          urls = (
              "https://151-241-221-199.sslip.io/health",
              "https://151-241-221-199.sslip.io/health/worker",
          )
          last_error = None
          for _ in range(20):
              try:
                  if all(urlopen(url, timeout=8).status == 200 for url in urls):
                      break
              except URLError as exc:
                  last_error = exc
              time.sleep(3)
          else:
              raise SystemExit(f"production health check failed: {last_error}")
          PY
