name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Copy application
        run: |
          set -euo pipefail
          test -n "$SERVER_IP"
          test -n "$SERVER_USER"
          test -n "$SERVER_PASSWORD"
          export SSHPASS="$SERVER_PASSWORD"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts"
          sshpass -e ssh "$SERVER_USER@$SERVER_IP" 'mkdir -p "$HOME/anki-papers"'
          git archive --format=tar.gz HEAD | \
            sshpass -e ssh "$SERVER_USER@$SERVER_IP" 'tar -xzf - -C "$HOME/anki-papers"'
      - name: Copy runtime configuration
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          {
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            printf 'OPENROUTER_MODEL=%s\n' "$OPENROUTER_MODEL"
            printf 'APP_SECRET=%s\n' "$APP_SECRET"
          } | sshpass -e ssh "$SERVER_USER@$SERVER_IP" \
            'umask 077; cat > "$HOME/anki-papers/.env"'
      - name: Install and restart Python process
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          encoded_password="$(printf '%s' "$SERVER_PASSWORD" | base64 -w 0)"
          sshpass -e ssh "$SERVER_USER@$SERVER_IP" \
            "DEPLOY_PASSWORD_B64=$encoded_password bash -se" <<'REMOTE'
          cd "$HOME/anki-papers"
          app_dir="$HOME/anki-papers"
          data_dir="$app_dir/data"
          current_user="$(id -un)"
          run_root() {
            if test "$(id -u)" -eq 0; then
              "$@"
            else
              printf '%s' "$DEPLOY_PASSWORD_B64" | base64 -d | sudo -S -p '' "$@"
            fi
          }

          if ! python3 -m venv .venv; then
            venv_package="python$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')-venv"
            run_root apt-get update
            run_root apt-get install -y "$venv_package"
            python3 -m venv --clear .venv
          fi
          if command -v ufw >/dev/null 2>&1; then
            run_root ufw allow 8000/tcp
          fi
          mkdir -p "$data_dir"
          chmod 700 "$data_dir"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install .
          .venv/bin/python -c 'from articles_to_anki.webapp import create_app; create_app()'

          if test -f app.pid; then
            old_pid="$(cat app.pid)"
            if kill -0 "$old_pid" 2>/dev/null && \
               ps -p "$old_pid" -o command= | grep -q 'articles_to_anki.webapp'; then
              kill "$old_pid"
              for _ in 1 2 3 4 5; do
                kill -0 "$old_pid" 2>/dev/null || break
                sleep 1
              done
            fi
          fi

          service_file="$app_dir/.anki-papers.service"
          {
            printf '%s\n' '[Unit]'
            printf '%s\n' 'Description=Anki Papers web application'
            printf '%s\n' 'After=network.target'
            printf '\n'
            printf '%s\n' '[Service]'
            printf '%s\n' 'Type=simple'
            printf 'User=%s\n' "$current_user"
            printf 'WorkingDirectory=%s\n' "$app_dir"
            printf 'Environment=ANKI_PAPERS_DATA_DIR=%s\n' "$data_dir"
            printf 'ExecStart=%s/.venv/bin/python -m articles_to_anki.webapp --host 0.0.0.0 --port 8000\n' "$app_dir"
            printf '%s\n' 'Restart=always'
            printf '%s\n' 'RestartSec=3'
            printf '%s\n' 'UMask=0077'
            printf '\n'
            printf '%s\n' '[Install]'
            printf '%s\n' 'WantedBy=multi-user.target'
          } > "$service_file"
          run_root install -m 0644 "$service_file" /etc/systemd/system/anki-papers.service
          run_root systemctl daemon-reload
          run_root systemctl enable anki-papers.service
          run_root systemctl restart anki-papers.service
          run_root systemctl is-active --quiet anki-papers.service
          unset DEPLOY_PASSWORD_B64

          .venv/bin/python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          last_error = None
          for _ in range(15):
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=5) as response:
                      if response.status == 200:
                          break
                      last_error = RuntimeError(f"health check failed: {response.status}")
              except URLError as exc:
                  last_error = exc
              time.sleep(2)
          else:
              raise SystemExit(f"health check failed after retries: {last_error}")
          PY
          REMOTE
