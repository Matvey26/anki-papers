name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]' -e ./sync-worker
      - run: pytest -q
      - run: RUN_ANKI_SYNC_INTEGRATION=1 pytest -q tests/test_anki_integration.py
      - run: python -m pip check

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: deepseek/deepseek-v4-flash-0731:nitro
      OPENROUTER_SEMANTIC_MODEL: deepseek/deepseek-v4-flash-0731:nitro
      APP_SECRET: ${{ secrets.APP_SECRET }}
      ANKI_CREDENTIAL_KEY: ${{ secrets.ANKI_CREDENTIAL_KEY }}
      ANKIWEB_ALLOWED_USERS: risesduckness
    steps:
      - uses: actions/checkout@v5
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Copy application
        run: |
          set -euo pipefail
          test -n "$SERVER_IP"
          test -n "$SERVER_USER"
          test -n "$SERVER_PASSWORD"
          test -n "$ANKI_CREDENTIAL_KEY"
          export SSHPASS="$SERVER_PASSWORD"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts"
          sshpass -e ssh "$SERVER_USER@$SERVER_IP" 'mkdir -p "$HOME/anki-papers"'
          git archive --format=tar.gz HEAD | \
            sshpass -e ssh "$SERVER_USER@$SERVER_IP" 'tar -xzf - -C "$HOME/anki-papers"'
      - name: Copy runtime configuration
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          {
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            printf 'OPENROUTER_MODEL=%s\n' "$OPENROUTER_MODEL"
            printf 'OPENROUTER_SEMANTIC_MODEL=%s\n' "$OPENROUTER_SEMANTIC_MODEL"
            printf 'APP_SECRET=%s\n' "$APP_SECRET"
            printf 'ANKI_CREDENTIAL_KEY=%s\n' "$ANKI_CREDENTIAL_KEY"
            printf 'ANKIWEB_ALLOWED_USERS=%s\n' "$ANKIWEB_ALLOWED_USERS"
          } | sshpass -e ssh "$SERVER_USER@$SERVER_IP" \
            'umask 077; cat > "$HOME/anki-papers/.env"'
      - name: Back up, install, and restart services
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          encoded_password="$(printf '%s' "$SERVER_PASSWORD" | base64 -w 0)"
          sshpass -e ssh "$SERVER_USER@$SERVER_IP" \
            "DEPLOY_PASSWORD_B64=$encoded_password bash -se" <<'REMOTE'
          cd "$HOME/anki-papers"
          app_dir="$HOME/anki-papers"
          data_dir="$app_dir/data"
          current_user="$(id -un)"
          run_root() {
            if test "$(id -u)" -eq 0; then
              "$@"
            else
              printf '%s' "$DEPLOY_PASSWORD_B64" | base64 -d | sudo -S -p '' "$@"
            fi
          }

          if ! python3 -m venv .venv; then
            venv_package="python$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')-venv"
            run_root apt-get update
            run_root apt-get install -y "$venv_package"
            python3 -m venv --clear .venv
          fi
          run_root apt-get update
          run_root apt-get install -y caddy
          if command -v ufw >/dev/null 2>&1; then
            run_root ufw allow 80/tcp
            run_root ufw allow 443/tcp
            run_root ufw --force delete allow 8000/tcp || true
          fi
          mkdir -p "$data_dir"
          chmod 700 "$data_dir"
          backup_dir="$data_dir/backups/$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$backup_dir"
          chmod 700 "$backup_dir"
          BACKUP_DIR="$backup_dir" DATA_DIR="$data_dir" python3 - <<'PY'
          import os
          import shutil
          import sqlite3
          from pathlib import Path

          data = Path(os.environ["DATA_DIR"])
          backup = Path(os.environ["BACKUP_DIR"])
          database = data / "app.sqlite3"
          if database.exists():
              source = sqlite3.connect(database)
              destination = sqlite3.connect(backup / "app.sqlite3")
              with destination:
                  source.backup(destination)
              destination.close()
              source.close()
          for pattern in ("uploads/**/*.apkg", "anki_mirrors/*.enc"):
              for source_path in data.glob(pattern):
                  relative = source_path.relative_to(data)
                  destination_path = backup / relative
                  destination_path.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source_path, destination_path)
          PY
          run_root systemctl stop anki-papers.service 2>/dev/null || true
          run_root systemctl stop anki-papers-web.service 2>/dev/null || true
          run_root systemctl stop anki-papers-sync-worker.service 2>/dev/null || true
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install . ./sync-worker
          .venv/bin/python -m pip check
          .venv/bin/python -c 'from articles_to_anki.webapp import create_app; create_app()'

          for unit in anki-papers-web anki-papers-sync-worker; do
            rendered="$app_dir/.$unit.service"
            sed \
              -e "s|__APP_DIR__|$app_dir|g" \
              -e "s|__DATA_DIR__|$data_dir|g" \
              -e "/^\[Service\]/a User=$current_user" \
              "deploy/$unit.service" > "$rendered"
            run_root install -m 0644 "$rendered" "/etc/systemd/system/$unit.service"
          done
          run_root install -d -o caddy -g caddy -m 0750 /var/log/caddy
          run_root install -m 0644 deploy/Caddyfile /etc/caddy/Caddyfile
          run_root systemctl disable --now anki-papers.service 2>/dev/null || true
          run_root systemctl daemon-reload
          run_root systemctl enable anki-papers-web.service anki-papers-sync-worker.service caddy.service
          run_root systemctl restart anki-papers-web.service anki-papers-sync-worker.service caddy.service
          run_root systemctl is-active --quiet anki-papers-web.service
          run_root systemctl is-active --quiet anki-papers-sync-worker.service
          run_root systemctl is-active --quiet caddy.service
          unset DEPLOY_PASSWORD_B64

          .venv/bin/python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          last_error = None
          for _ in range(15):
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=5) as response:
                      if response.status == 200:
                          break
                      last_error = RuntimeError(f"health check failed: {response.status}")
              except URLError as exc:
                  last_error = exc
              time.sleep(2)
          else:
              raise SystemExit(f"health check failed after retries: {last_error}")
          PY
          REMOTE
      - name: Verify production HTTPS and worker heartbeat
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          urls = (
              "https://151-241-221-199.sslip.io/health",
              "https://151-241-221-199.sslip.io/health/worker",
          )
          last_error = None
          for _ in range(20):
              try:
                  if all(urlopen(url, timeout=8).status == 200 for url in urls):
                      break
              except URLError as exc:
                  last_error = exc
              time.sleep(3)
          else:
              raise SystemExit(f"production health check failed: {last_error}")
          PY
